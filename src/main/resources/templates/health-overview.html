
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>General Health Overview</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>

    <h1>General Health Overview</h1>

   <form th:action="@{/health-overview}" method="post">

        <label>Patient ID:</label>
        <input type="number" name="patientId" min="1" required>
        <br><br>

        <label>Blood Group:</label>
        <select name="bloodGroup">
            <option value="">Select Blood Group</option>
            <option value="A+">A+</option>
            <option value="A-">A-</option>
            <option value="B+">B+</option>
            <option value="B-">B-</option>
            <option value="AB+">AB+</option>
            <option value="AB-">AB-</option>
            <option value="O+">O+</option>
            <option value="O-">O-</option>
            <option value="Unknown">Unknown</option>
        </select>
        <br><br>

        <label>Allergies:</label>
        <input type="text" name="allergies" placeholder="Enter allergies or Not known">
        <br><br>

        <label>Left Eye Power (D):</label>
        <input type="text" name="leftEyePower" placeholder="e.g. -1.50 or Not tested">
        <br><br>

        <label>Right Eye Power (D):</label>
        <input type="text" name="rightEyePower" placeholder="e.g. -2.00 or Not tested">
        <br><br>

        <label>Height (cm):</label>
        <input type="number" name="height" step="0.1" min="0">
        <br><br>

        <label>Weight (kg):</label>
        <input type="number" name="weight" step="0.1" min="0">
        <br><br>

        <label>Existing Conditions:</label>
        <textarea name="existingConditions" placeholder="Enter known conditions"></textarea>
        <br><br>

        <label>Current Medicines:</label>
        <textarea name="currentMedicines" placeholder="Enter current medicines"></textarea>
        <br><br>

        <button type="submit">Save Health Overview</button>

    </form>

    <br>
    <a href="/patients">Back to Patient List</a>

</body>
</html>
